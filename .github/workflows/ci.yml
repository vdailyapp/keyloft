name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # Không pin đường dẫn Xcode cứng: image runner gỡ bản cũ theo thời gian.
      - name: Chọn Xcode stable mới nhất
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-
      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Check imports (U2)
        run: ./scripts/test-check-imports.sh
